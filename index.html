<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>幻獸們｜MVP</title>
<style>
:root{
  --bg:#f5f0e8; --card:#fffdf8; --ink:#2b2d35; --muted:#747681; --line:#ded8cf;
  --accent:#6b7cff; --accent2:#9b72ff; --good:#2f9e6f; --warn:#d48a21;
  --shadow:0 12px 28px rgba(42,45,58,.10);
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;background:
linear-gradient(180deg,#ebe7ff 0,#f5f0e8 28%,#f5f0e8 100%);color:var(--ink)}
button{font:inherit}
.wrap{max-width:1080px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px}
.brand h1{margin:0;font-size:clamp(28px,5vw,48px);letter-spacing:.04em}
.brand p{margin:4px 0 0;color:var(--muted)}
.pill{background:#ffffffb8;border:1px solid #ffffff;padding:9px 14px;border-radius:999px;box-shadow:var(--shadow);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}
.hidden{display:none!important}
.title{font-size:20px;font-weight:900;margin:0 0 14px}
.egg-grid,.dex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.egg{border:1px solid var(--line);background:#fff;border-radius:20px;padding:16px;text-align:center;cursor:pointer;transition:.2s;min-height:190px}
.egg:hover{transform:translateY(-3px);box-shadow:0 10px 24px #00000012}
.egg-art{font-size:78px;line-height:1.1;filter:drop-shadow(0 7px 8px #0002)}
.egg-shell{
  --egg-spot:#888;
  display:inline-block;
  width:72px;
  height:92px;
  border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;
  background:
    radial-gradient(circle at 29% 30%, var(--egg-spot) 0 5px, transparent 5.8px),
    radial-gradient(circle at 66% 25%, var(--egg-spot) 0 4px, transparent 4.8px),
    radial-gradient(circle at 53% 49%, var(--egg-spot) 0 6px, transparent 6.8px),
    radial-gradient(circle at 27% 61%, var(--egg-spot) 0 3.7px, transparent 4.5px),
    radial-gradient(circle at 69% 69%, var(--egg-spot) 0 5px, transparent 5.8px),
    linear-gradient(145deg,#fffdf7 0%,#ebe7dd 66%,#d8d2c7 100%);
  border:2px solid rgba(84,76,65,.15);
  box-shadow:inset -8px -10px 14px rgba(70,60,45,.08), inset 8px 7px 12px rgba(255,255,255,.68), 0 8px 12px rgba(0,0,0,.12);
  vertical-align:middle;
}
#careIcon .egg-shell{width:92px;height:118px;}
.action:disabled{opacity:.38!important;filter:grayscale(.55);cursor:not-allowed!important;box-shadow:none!important;}
.egg h3{margin:8px 0 4px}.egg small{color:var(--muted)}
.scene{min-height:340px;display:grid;place-items:center;background:
radial-gradient(circle at 50% 85%,#ffffff 0 20%,#ebf0ff 21% 50%,transparent 51%),
linear-gradient(#dff1ff 0 65%,#dff4e8 65%);border-radius:22px;border:1px solid var(--line);position:relative;overflow:hidden}
.scene:before,.scene:after{content:"";position:absolute;border-radius:50%;background:#fff8;filter:blur(1px)}
.scene:before{width:120px;height:34px;left:8%;top:14%}.scene:after{width:160px;height:40px;right:8%;top:24%}
.creature{
  z-index:2;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  width:min(100%,420px);
}
.status-bubble{
  position:relative;
  width:min(92%,360px);
  padding:14px 16px;
  border-radius:18px;
  background:rgba(255,255,255,.92);
  border:1px solid #e7e0d6;
  box-shadow:0 10px 24px rgba(0,0,0,.08);
  color:#595b66;
}
.status-bubble::after{
  content:"";
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:-10px;
  width:18px;
  height:18px;
  background:rgba(255,255,255,.92);
  border-right:1px solid #e7e0d6;
  border-bottom:1px solid #e7e0d6;
  rotate:45deg;
}
.status-bubble .log{
  margin:0;
  min-height:50px;
  padding:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:15px;
  line-height:1.5;
  font-weight:800;
}
.creature .big{font-size:116px;display:block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.creature-name{font-size:24px;font-weight:900;margin-top:2px}
.type-tag{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:800}
.stats{display:grid;gap:12px}
.stat-row{display:grid;grid-template-columns:72px 1fr 44px;align-items:center;gap:10px}
.bar{height:12px;background:#ece9e3;border-radius:999px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;transition:.25s}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.action,.main-btn,.ghost-btn{border:0;border-radius:16px;padding:14px 16px;font-weight:900;cursor:pointer}
.action{background:#fff;border:1px solid var(--line);box-shadow:0 5px 12px #00000009}
.action:hover{transform:translateY(-1px)}
.main-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}
.ghost-btn{background:#fff;border:1px solid var(--line)}
.log{margin-top:14px;padding:12px 14px;border-radius:16px;background:#f3f1ec;color:#595b66;min-height:48px}
.dex-card{position:relative;border:1px solid var(--line);border-radius:18px;background:#fff;padding:12px;text-align:center;min-height:190px}
.dex-card.locked{filter:grayscale(1)}
.dex-card .icon{font-size:62px}
.dex-card.locked .icon{filter:brightness(0);opacity:.18}
.dex-card h4{margin:8px 0 3px}

/* 幻彩卡片：七彩霓虹感 */
.dex-card.prism{
  border:2px solid transparent;
  background:
    linear-gradient(#fff,#fff) padding-box,
    linear-gradient(135deg,#ff5fa2 0%,#ffd45f 18%,#82ff9e 36%,#67e8ff 54%,#7a7cff 72%,#d36bff 88%,#ff5fa2 100%) border-box;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.75) inset,
    0 0 12px rgba(255,95,162,.22),
    0 0 18px rgba(103,232,255,.20),
    0 0 26px rgba(122,124,255,.16);
  overflow:hidden;
}
.dex-card.prism::before{
  content:"";
  position:absolute;
  inset:-30%;
  background:conic-gradient(from 0deg,#ff5fa2,#ffd45f,#82ff9e,#67e8ff,#7a7cff,#d36bff,#ff5fa2);
  opacity:.16;
  filter:blur(18px);
  animation:prismSpin 9s linear infinite;
  pointer-events:none;
}
.dex-card.prism::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(120deg,transparent 0%,rgba(255,255,255,.00) 32%,rgba(255,255,255,.45) 50%,rgba(255,255,255,.00) 68%,transparent 100%);
  transform:translateX(-130%);
  animation:prismSweep 4.5s ease-in-out infinite;
  pointer-events:none;
}
.dex-card.prism > *{position:relative;z-index:1}
.dex-card.prism .icon{
  filter:drop-shadow(0 0 10px rgba(255,113,196,.30)) drop-shadow(0 0 16px rgba(103,232,255,.26));
}
.dex-card.prism .rarity{
  display:inline-block;
  padding:2px 8px;
  border-radius:999px;
  background:linear-gradient(135deg,#fff4fb,#f5efff);
  box-shadow:0 0 10px rgba(211,107,255,.18);
}
.dex-card.prism.locked{
  filter:none;
  opacity:.88;
}
.dex-card.prism.locked .icon{
  filter:brightness(0) opacity(.16);
}
.dex-card.prism.locked::before{
  opacity:.10;
}
@keyframes prismSpin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
@keyframes prismSweep{
  0%,65%,100%{transform:translateX(-130%)}
  82%{transform:translateX(130%)}
}
.prism-stars{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
  overflow:hidden;
}
.prism-stars i{
  position:absolute;
  width:4px;height:4px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 6px #fff,0 0 11px #9cf,0 0 16px #f9c;
  opacity:0;
  animation:prismTwinkle 2.6s ease-in-out infinite;
}
.prism-stars i:nth-child(1){left:14%;top:20%;animation-delay:.1s}
.prism-stars i:nth-child(2){left:78%;top:18%;animation-delay:.7s}
.prism-stars i:nth-child(3){left:28%;top:64%;animation-delay:1.2s}
.prism-stars i:nth-child(4){left:70%;top:72%;animation-delay:1.8s}
.prism-stars i:nth-child(5){left:48%;top:12%;animation-delay:2.1s}
.prism-stars i:nth-child(6){left:88%;top:50%;animation-delay:1.45s}
.prism-stars i:nth-child(7){left:8%;top:78%;animation-delay:2.35s}
@keyframes prismTwinkle{
  0%,100%{transform:scale(.25);opacity:0}
  35%{opacity:.35}
  50%{transform:scale(1.9);opacity:1}
  68%{opacity:.25}
}
@media (prefers-reduced-motion: reduce){
  .dex-card.prism::before,.dex-card.prism::after,.prism-stars i{animation:none!important}
  .prism-stars i{opacity:.6}
}
.dex-toolbar{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
.dex-tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:900;cursor:pointer}
.dex-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.dex-section{margin-top:22px}
.dex-section:first-child{margin-top:16px}
.dex-section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.dex-section-title{margin:0;font-size:20px;font-weight:950}
.dex-progress{font-size:13px;color:var(--muted);font-weight:800}
.dex-subprogress{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.dex-subprogress span{padding:6px 10px;border-radius:999px;background:#f3f1ec;border:1px solid var(--line);font-size:12px;font-weight:800}
.dex-divider{height:1px;background:var(--line);margin:22px 0 0}
.meta{font-size:12px;color:var(--muted)}
.rarity{font-weight:900}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.legend span{padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px}
.hatch-card{text-align:center;padding:10px}
.hatch-icon{font-size:112px;animation:pop .55s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:scale(1);opacity:1}}
.two{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.notice{font-size:13px;color:var(--muted);margin-top:10px}
footer{padding:16px 0 6px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:980px){
 .egg-grid,.dex-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:780px){
 .wrap{padding:14px}.grid{grid-template-columns:1fr}.egg-grid,.dex-grid{grid-template-columns:1fr}
 .egg{min-height:0}.actions{grid-template-columns:1fr}.scene{min-height:290px}
 header{align-items:flex-start;flex-direction:column}.pill{align-self:flex-start}
 .dex-toolbar{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
 .dex-tab{width:100%;padding:10px 8px}
 .dex-section-head{align-items:flex-start;flex-direction:column}
}


.actions{
  grid-template-columns:repeat(3,minmax(150px,1.5fr)) !important;
  justify-content:center;
}
.action{
  min-width:150px;
}
@media(max-width:780px){
  .actions{grid-template-columns:1fr !important;}
  .action{width:100%;min-width:0;}
}


/* 手機優先：確保選蛋區在 iPhone / Safari 可見且可點擊 */
#screen-start{
  display:block;
  width:100%;
  overflow:visible;
}

#eggGrid{
  width:100%;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  overflow:visible;
}

#eggGrid .egg{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  min-width:0;
  min-height:190px;
  visibility:visible;
  opacity:1;
  -webkit-appearance:none;
  appearance:none;
  touch-action:manipulation;
  position:relative;
  z-index:1;
}

#eggGrid .egg:active{
  transform:scale(.98);
}

@media(max-width:980px){
  #eggGrid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(max-width:600px){
  .wrap{
    width:100%;
    max-width:none;
    padding:12px;
    overflow:visible;
  }

  #screen-start{
    padding:14px;
    min-height:0;
  }

  #eggGrid{
    display:grid !important;
    grid-template-columns:1fr !important;
    gap:12px;
    width:100%;
    min-height:0;
    overflow:visible;
  }

  #eggGrid .egg{
    display:flex !important;
    width:100% !important;
    min-height:132px;
    padding:16px;
    overflow:visible;
  }

  #eggGrid .egg-art{
    font-size:64px;
  }

  #eggGrid .egg h3{
    margin:8px 0 0;
    font-size:20px;
  }

  .scene{
    min-height:320px;
    padding:16px 12px;
  }

  .creature{
    width:100%;
    gap:10px;
  }

  .status-bubble{
    width:min(100%,340px);
    padding:12px 14px;
  }

  .status-bubble .log{
    min-height:44px;
    font-size:14px;
  }

  header{
    margin-bottom:12px;
  }

  .brand h1{
    font-size:32px;
  }

  .panel{
    border-radius:18px;
  }
}


@supports(padding:max(0px)){
  body{
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
}

/* 每次進入遊戲都會顯示的開頭畫面 */
.boot-screen{
  position:fixed;
  inset:0;
  z-index:9999;
  display:grid;
  place-items:center;
  padding:22px;
  background:
    radial-gradient(circle at 50% 38%,rgba(142,120,255,.32),transparent 28%),
    radial-gradient(circle at 20% 20%,rgba(103,232,255,.18),transparent 22%),
    radial-gradient(circle at 82% 78%,rgba(255,95,162,.18),transparent 24%),
    linear-gradient(160deg,#17182b 0%,#232542 48%,#131422 100%);
}
.boot-screen.hidden{display:none!important}
.boot-card{
  width:min(92vw,520px);
  padding:36px 28px 28px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:30px;
  background:rgba(255,255,255,.09);
  box-shadow:0 24px 80px rgba(0,0,0,.34);
  backdrop-filter:blur(18px);
  text-align:center;
  color:#fff;
}
.boot-orb{
  font-size:92px;
  filter:drop-shadow(0 0 18px rgba(137,121,255,.48));
  animation:bootFloat 2.6s ease-in-out infinite;
}
.boot-kicker{font-size:11px;letter-spacing:.24em;opacity:.7;font-weight:900;margin-top:8px}
.boot-card h1{font-size:clamp(42px,10vw,68px);margin:8px 0 6px;letter-spacing:.08em}
.boot-card p{margin:0 auto 24px;max-width:360px;line-height:1.7;color:rgba(255,255,255,.78)}
.boot-actions{display:grid;gap:12px;position:relative;z-index:5}
.boot-btn{
  width:100%;
  font-size:17px;
  padding:16px 18px;
  position:relative;
  z-index:6;
  pointer-events:auto;
  -webkit-user-select:none;
  user-select:none;
}
.boot-music{
  margin-top:16px;
  border:0;
  background:transparent;
  color:rgba(255,255,255,.76);
  font-weight:800;
  cursor:pointer;
  padding:8px 12px;
}
.boot-note{font-size:11px;color:rgba(255,255,255,.48);margin-top:4px}
@keyframes bootFloat{50%{transform:translateY(-7px) rotate(2deg)}}

/* 全域按鈕按壓回饋 */
button{
  transition:transform .11s ease, box-shadow .11s ease, filter .11s ease, opacity .11s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button.press-feedback{
  transform:scale(1.045)!important;
  filter:brightness(1.04);
}
button:disabled{transform:none!important}

/* 「全部」頁為單一平面圖鑑，不再按屬性分區 */
.dex-all-head{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  margin:18px 0 12px;
}

</style>
</head>
<body>
<div id="bootScreen" class="boot-screen" aria-label="遊戲開頭畫面">
  <div class="boot-card">
    <div class="boot-orb">🥚</div>
    <div class="boot-kicker">PHANTOM BEASTS</div>
    <h1>幻獸們</h1>
    <p>培育元素、建立羈絆，孵化屬於你的幻獸。</p>
    <div class="boot-actions">
      <button type="button" class="main-btn boot-btn" id="bootStartBtn">開始遊戲</button>
      <button type="button" class="ghost-btn boot-btn" id="bootResetBtn">重新開始</button>
    </div>
    <button class="boot-music" id="musicToggleBtn" type="button">♫ 音樂：開</button>
    <div class="boot-note">音樂會在你第一次按下按鈕後播放。</div>
  </div>
</div>

<div class="wrap" id="gameRoot">
<header>
  <div class="brand">
    <h1>幻獸們</h1>
    <p>選蛋、照顧、孵化，收集屬於你的幻獸圖鑑。</p>
  </div>
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
    <div class="pill" id="coinDisplay">🪙 金幣 0</div>
    <div class="pill">MVP · 本機存檔</div>
  </div>
</header>

<section id="screen-start" class="panel">
  <h2 class="title">選擇一顆幻獸蛋</h2>
  <div class="egg-grid" id="eggGrid"></div>
  
</section>

<section id="screen-care" class="grid hidden">
  <div class="panel">
    <h2 class="title">培育室</h2>
    <div class="scene">
      <div class="creature">
        <div class="status-bubble" id="statusBubble" aria-live="polite">
          <div class="log" id="log">蛋正在孵化……</div>
        </div>
        <span class="big" id="careIcon">🥚</span>
        <div class="creature-name" id="eggName">幻獸蛋</div>
      </div>
    </div>
    <div class="actions">
      <button class="action" type="button" data-act="feed">🌀 元素導入</button>
      <button class="action" type="button" data-act="play">🤲 愛撫</button>
      <button class="action" type="button" data-act="rest">🌙 休息</button>
    </div>
    
  </div>
  <div class="panel">
    <h2 class="title">成長狀態</h2>
    <div class="stats" id="stats"></div>
    <div style="margin-top:18px">
      <div class="meta">培育傾向</div>
      <div id="careTendency" style="font-weight:900;margin-top:4px">尚未形成</div>
    </div>
    <button class="ghost-btn" id="abandonBtn" style="width:100%;margin-top:18px">放棄本次培育</button>
  </div>
</section>

<section id="screen-hatch" class="panel hidden">
  <div class="hatch-card">
    <div style="font-weight:900;color:var(--accent)">孵化成功</div>
    <div class="hatch-icon" id="hatchIcon">🐉</div>
    <h2 id="hatchName" style="margin:0"></h2>
    <div id="hatchMeta" style="margin-top:8px;color:var(--muted)"></div>
    <p id="hatchDesc"></p>
    <div class="two">
      <button class="main-btn" id="toDexBtn">收錄並查看圖鑑</button>
      <button class="ghost-btn" id="newRunBtn">重新培育</button>
    </div>
  </div>
</section>

<section id="screen-dex" class="panel hidden" style="margin-top:18px">
  <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap">
    <h2 class="title" style="margin:0">幻獸圖鑑</h2>
    <button class="main-btn" id="dexNewBtn">培育新的幻獸</button>
  </div>
  <div class="dex-toolbar" id="dexTabs" aria-label="圖鑑分類">
    <button class="dex-tab active" data-dex-filter="all">全部</button>
    <button class="dex-tab" data-dex-filter="fire">🔥 火</button>
    <button class="dex-tab" data-dex-filter="water">💧 水</button>
    <button class="dex-tab" data-dex-filter="wind">🍃 風</button>
    <button class="dex-tab" data-dex-filter="forest">🪨 土</button>
    <button class="dex-tab" data-dex-filter="prism">🌈 幻彩</button>
  </div>

let audioCtx=null;

let musicTimer=null;
let musicStep=0;
let audioUnlocked=false;

async function ensureAudio(){
  if(!audioCtx){
    const AC=window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx=new AC();
  }
  try{
    if(audioCtx.state==="suspended"){
      await audioCtx.resume();
    }
    audioUnlocked = audioCtx.state==="running";
  }catch(e){}
  return audioCtx;
}

async function unlockAudio(){
  const ctx=await ensureAudio();
  if(!ctx) return false;

  // iOS Safari：用極短的靜音音符在使用者手勢中真正解鎖 AudioContext。
  try{
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    gain.gain.setValueAtTime(0.00001,ctx.currentTime);
    osc.connect(gain).connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+0.02);
    audioUnlocked=true;
  }catch(e){}
  return audioUnlocked;
}

async function playClickSound(){
  const ctx=await ensureAudio();
  if(!ctx || ctx.state!=="running") return;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.setValueAtTime(520,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(720,ctx.currentTime+.055);
  gain.gain.setValueAtTime(.0001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.045,ctx.currentTime+.008);
  gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.08);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+.085);
}

async function playMusicNote(freq,duration=.7,volume=.018){
  if(!musicEnabled) return;
  const ctx=await ensureAudio();
  if(!ctx || ctx.state!=="running") return;
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="triangle";
  osc.frequency.setValueAtTime(freq,ctx.currentTime);
  gain.gain.setValueAtTime(.0001,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(volume,ctx.currentTime+.08);
  gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime+duration+.03);
}

async function startMusic(){
  if(!musicEnabled || musicTimer) return;
  await unlockAudio();
  if(!audioCtx || audioCtx.state!=="running") return;

  const melody=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23];
  const tick=()=>{
    if(!musicEnabled){
      musicTimer=null;
      return;
    }
    playMusicNote(melody[musicStep%melody.length],.8,.016);
    if(musicStep%2===0){
      playMusicNote(melody[(musicStep+4)%melody.length]/2,.95,.010);
    }
    musicStep++;
    musicTimer=setTimeout(tick,900);
  };
  tick();
}

function stopMusic(){
  if(musicTimer){
    clearTimeout(musicTimer);
    musicTimer=null;
  }
}

  stage:"start", egg:null,

  actions:{feed:0,play:0,rest:0},
  dex:[], dexCounts:{}, last:null
};

function load(){
  try{return JSON.parse(localStorage.getItem(SAVE_KEY))}

  try{localStorage.setItem(SAVE_KEY, JSON.stringify(state))}
  catch(e){}

function clamp(v){return Math.max(0,Math.min(100,v));}

function penalizedGrowth(base, stage){
  if(stage<=0) return base;
  // 每次懲罰減半，無條件捨去：7→3→1→0、4→2→1→0、10→5→2→1→0
  return Math.max(0, Math.floor(base / Math.pow(2, stage)));
}

function updatePenaltyRecovery(){
  if(!state.penalty) state.penalty={element:0,mood:0};
  // 對應狀態恢復到 >0 時，連續懲罰重置。
  if(state.stats.hunger>0) state.penalty.element=0;
  if(state.stats.mood>0) state.penalty.mood=0;
}

function tendency(){
  const a=state.actions, entries=Object.entries(a).sort((x,y)=>y[1]-x[1]);
  const total=a.feed+a.play+a.rest;
  if(total<2)return "尚未形成";

function updateActionAvailability(){
  const caring = state.stage==="care";
  const noEnergy = caring && state.stats.energy<=0;
  const fullEnergy = caring && state.stats.energy>=100;

  document.querySelectorAll(".action").forEach(btn=>{
    let shouldDisable = isHatching;

    // 元氣為 0：只能休息。
    if(noEnergy && btn.dataset.act!=="rest") shouldDisable = true;

    // 元氣為 100：休息不能再使用。
    if(fullEnergy && btn.dataset.act==="rest") shouldDisable = true;

    btn.disabled = shouldDisable;
    btn.style.opacity = shouldDisable ? ".38" : "";
    btn.style.cursor = shouldDisable ? "not-allowed" : "";
  });
}

  updateActionAvailability();
  if(state.stats.growth >= 90 && state.stats.growth < 100 && !isHatching){
    logEl.textContent = "蛋殼開始頻繁晃動，裂紋正在擴散……似乎即將孵化！";
  }
}
function act(kind){
  if(isHatching || state.stage !== "care") return;

  let s=state.stats;
  if(!state.penalty) state.penalty={element:0,mood:0};

  // 以按下按鈕前的狀態判定低狀態懲罰。
  const beforeElement = s.hunger;
  const beforeMood = s.mood;

  // 元氣為 0 時，只能休息。
  if(s.energy<=0 && kind!=="rest"){
    logEl.textContent="元氣耗盡了，現在只能先讓幻獸蛋休息。";
    updateActionAvailability();
    return;
  }

  // 元氣為 100 時，休息停用。
  if(kind==="rest" && s.energy>=100){
    logEl.textContent="蛋的元氣已經完全恢復，必須先消耗元氣才能再次休息。";
    updateActionAvailability();
    return;
  }

  let growthGain=0;
  let penaltyStage=0;

  if(kind==="feed"){
    const overfed = s.hunger >= 100;

    if(overfed){
      s.mood=clamp(s.mood-10);
      s.bond=clamp(s.bond-8);
      s.energy=clamp(s.energy-5);

      if(beforeMood===0){
        state.penalty.mood += 1;
        penaltyStage = state.penalty.mood;
        growthGain = penalizedGrowth(7, penaltyStage);
      }else{
        growthGain = 7;
      }

      s.growth=clamp(s.growth+growthGain);
      logEl.textContent = beforeMood===0
        ? `心情已降到最低。這次元素導入的成長效率下降，成長值 +${growthGain}。`
        : "蛋內的元素力已經飽和。繼續導入元素使能量失衡，心情與親密度都下降。";
    }else{
      s.hunger=clamp(s.hunger+10);
      s.mood=clamp(s.mood-10);
      s.energy=clamp(s.energy-10);

      if(beforeMood===0){
        state.penalty.mood += 1;
        penaltyStage = state.penalty.mood;
        growthGain = penalizedGrowth(7, penaltyStage);
        // 心情 0：親密度仍不增加。
        logEl.textContent=`心情已降到最低。元素導入無法增加親密度，成長效率下降為 +${growthGain}。`;
      }else{
        s.bond=clamp(s.bond+3);
        growthGain = 7;
        logEl.textContent="元素導入提升了元素力與少量親密度，但會降低心情與元氣。";
      }

      s.growth=clamp(s.growth+growthGain);
    }

  }else if(kind==="play"){
    const overplayed = s.mood >= 100;

    s.hunger=clamp(s.hunger-8);
    s.energy=clamp(s.energy-15);

    if(beforeElement===0){
      state.penalty.element += 1;
      penaltyStage = state.penalty.element;
      growthGain = penalizedGrowth(4, penaltyStage);

      if(!overplayed) s.mood=clamp(s.mood+10);
      s.bond=clamp(s.bond-5);
      s.growth=clamp(s.growth+growthGain);

      logEl.textContent=`元素力已耗盡。愛撫使親密度 -5，成長效率下降為 +${growthGain}。`;
    }else{
      growthGain=4;
      s.growth=clamp(s.growth+growthGain);

      if(overplayed){
        s.bond=clamp(s.bond-10);
        logEl.textContent="蛋已經十分放鬆。持續愛撫反而讓牠感到厭煩，親密度下降。";
      }else{
        s.mood=clamp(s.mood+10);
        s.bond=clamp(s.bond+8);
        logEl.textContent="愛撫提高了心情與親密度，但會消耗元素力與元氣。";
      }
    }

  }else if(kind==="rest"){
    s.hunger=clamp(s.hunger-5);
    s.energy=clamp(s.energy+25);

    // 元素力與心情同時為 0 時，各自累積懲罰，但使用較嚴重的一級。
    let elementStage=0;
    let moodStage=0;

    if(beforeElement===0){
      state.penalty.element += 1;
      elementStage = state.penalty.element;
      s.bond=clamp(s.bond-5);
    }
    if(beforeMood===0){
      state.penalty.mood += 1;
      moodStage = state.penalty.mood;
      // 休息原本親密度 +0，因此心情 0 不需額外修改親密度。
    }

    if(beforeElement===0 || beforeMood===0){
      penaltyStage = Math.max(elementStage, moodStage);
      growthGain = penalizedGrowth(10, penaltyStage);
      s.growth=clamp(s.growth+growthGain);

      if(beforeElement===0 && beforeMood===0){
        logEl.textContent=`元素力與心情都已耗盡。親密度 -5，休息的成長效率下降為 +${growthGain}。`;
      }else if(beforeElement===0){
        logEl.textContent=`元素力已耗盡。親密度 -5，休息的成長效率下降為 +${growthGain}。`;
      }else{
        logEl.textContent=`心情已降到最低。休息無法增加親密度，成長效率下降為 +${growthGain}。`;
      }
    }else{
      growthGain=10;
      s.growth=clamp(s.growth+growthGain);
      logEl.textContent="休息恢復了大量元氣，但會消耗元素力。";
    }
  }

  // 只要對應狀態恢復到 >0，該低狀態連續懲罰就重新計算。
  updatePenaltyRecovery();

  state.actions[kind]++;
  save();
  renderCare();

  if(s.growth>=100){
    isHatching = true;
    document.querySelectorAll(".action").forEach(btn => {
      btn.disabled = true;
      btn.style.opacity = ".55";
      btn.style.cursor = "not-allowed";
    });
    logEl.textContent = "蛋正在孵化……";
    hatchTimer = setTimeout(hatch,450);
  }
}

function pickWeighted(items){
  const total=items.reduce((n,x)=>n+x.w,0); let r=Math.random()*total;
  for(const x of items){ r-=x.w; if(r<=0)return x.b; }
  return items[0].b;
}
function careProfile(s,a){
  const total = Math.max(1, a.feed + a.play + a.rest);
  const sorted = Object.entries(a).sort((x,y)=>y[1]-x[1]);
  const maxAct = sorted[0][0];
  const maxCount = sorted[0][1];
  const minCount = Math.min(a.feed,a.play,a.rest);
  const maxActions = Math.max(a.feed,a.play,a.rest);

  return {
    total,
    maxAct,
    dominantShare: maxCount / total,
    extreme: maxCount / total >= 0.70,
    balanced: a.feed>0 && a.play>0 && a.rest>0 && (maxActions-minCount)<=2,
    highBond: s.bond >= 50,
    lowBond: s.bond < 50
  };
}

function isEligible(b,s,a){
  const p = careProfile(s,a);

  switch(b.likes){
    case "feed":
      return p.highBond && p.maxAct==="feed" && s.hunger>=65;
    case "play":
      // 玩耍型：改看玩耍占比，避免「玩耍最多＋高親密」形成矛盾。
      if(b.id==="cindercat" || b.id==="wavepenguin" || b.id==="galefox"){
        return (a.play / Math.max(1,p.total)) >= 0.35 && s.mood>=65;
      }
      return p.highBond && p.maxAct==="play" && s.mood>=65;
    case "feed_high":
      return p.highBond && s.hunger>=85 && p.maxAct==="feed";
    case "play_high":
      // 旋風雀：高心情＋至少三次玩耍＋中高親密，不再要求玩耍一定最多。
      if(b.id==="gustfinch"){
        return s.mood>=85 && a.play>=3 && s.bond>=55;
      }
      return p.highBond && s.mood>=85 && p.maxAct==="play";
    case "mood_high":
      if(b.id==="tempestgryph"){
        return s.mood>=90 && s.bond>=65;
      }
      return p.highBond && s.mood>=85;
    case "energy_high":
      return p.highBond && s.energy>=85;
    case "bond_high":
      // 火花鼠：中高親密＋偏低元氣。
      if(b.id==="sparkmouse"){
        return s.bond>=60 && s.energy<70;
      }
      // 雨鰓螈：中高親密＋偏低元氣。
      if(b.id==="rainaxolotl"){
        return s.bond>=60 && s.energy<70;
      }
      // 陶甲小熊：中高親密＋偏低元氣。
      if(b.id==="claybear"){
        return s.bond>=70 && s.energy<65;
      }
      // 深潮魟：高親密稀有路線。
      if(b.id==="abyssray"){
        return s.bond>=78 && s.energy<75;
      }
      // 炎脈山貓：中高親密＋至少三次愛撫＋偏低元氣。
      if(b.id==="volcanolynx"){
        return s.bond>=63 && a.play>=3 && s.energy<70;
      }
      return s.bond>=70;
    case "balanced":
      // 岳冠鹿：維持均衡培育特色，但提高稀有門檻。
      if(b.id==="mountainstag"){
        const counts=[a.feed,a.play,a.rest];
        const maxC=Math.max(...counts), minC=Math.min(...counts);
        const stagBalanced=counts.every(v=>v>0) && (maxC-minC)<=2;
        return s.bond>=65 && stagBalanced &&
               s.hunger>=35 && s.mood>=55 && s.energy>=35;
      }
      return p.highBond && p.balanced &&
             s.hunger>=35 && s.mood>=50 && s.energy>=35;
    case "rest":
      if(b.id==="bubbleotter"){
        return s.bond<65 && p.maxAct==="rest" && s.energy>=65;
      }
      return p.lowBond && p.maxAct==="rest" && s.energy>=65;
    case "energy":
      return p.lowBond && s.energy>=60;
    case "rest_high":
      if(b.id==="duneturtle"){
        return s.bond<65 && s.energy>=85 && p.maxAct==="rest";
      }
      return p.lowBond && s.energy>=85 && p.maxAct==="rest";
    case "bond_low":
      // 低親密型：增加低元氣限制，避免吞掉所有低親密結果。
      if(b.id==="embergecko" || b.id==="brookfrog" || b.id==="whirlhamster" || b.id==="mudhippo"){
        return p.lowBond && s.energy<50;
      }
      return p.lowBond;
    default:
      return false;
  }
}

function qualificationWeight(b,s,a){
  const p = careProfile(s,a);
  let w = b.rarity==="稀有" ? 8 : 12;

  if(["feed","feed_high"].includes(b.likes) && p.maxAct==="feed") w += 14;
  if(["play","play_high"].includes(b.likes) && p.maxAct==="play") w += 14;
  if(["rest","rest_high"].includes(b.likes) && p.maxAct==="rest") w += 14;
  if(b.likes==="balanced" && p.balanced) w += 16;

  if(p.extreme){
    if(p.maxAct==="feed" && ["feed","feed_high"].includes(b.likes)) w += 18;
    if(p.maxAct==="play" && ["play","play_high","mood_high"].includes(b.likes)) w += 18;
    if(p.maxAct==="rest" && ["rest","rest_high","energy"].includes(b.likes)) w += 18;
  }

  if(s.hunger>=85 && ["feed","feed_high"].includes(b.likes)) w += 12;
  if(s.mood>=85 && ["play","play_high","mood_high"].includes(b.likes)) w += 12;
  if(s.energy>=85 && ["energy","energy_high","rest","rest_high"].includes(b.likes)) w += 12;
  if(s.bond>=70 && b.likes==="bond_high") w += 14;
  if(b.id==="sparkmouse" && s.bond>=60 && s.energy<70) w += 10;
  if(b.id==="rainaxolotl" && s.bond>=60 && s.energy<70) w += 10;
  if(b.id==="claybear" && s.bond>=70 && s.energy<65) w += 6;
  if(b.id==="bubbleotter" && s.bond<65 && p.maxAct==="rest" && s.energy>=65) w += 8;
  if(b.id==="duneturtle" && s.bond<65 && s.energy>=85 && p.maxAct==="rest") w += 8;
  if(b.id==="gustfinch" && s.mood>=85 && a.play>=3 && s.bond>=55) w += 10;
  if(b.id==="mountainstag"){
    const counts=[a.feed,a.play,a.rest];
    const maxC=Math.max(...counts), minC=Math.min(...counts);
    if(s.bond>=65 && counts.every(v=>v>0) && (maxC-minC)<=2) w += 4;
  }
  if(b.id==="volcanolynx" && s.bond>=63 && a.play>=3 && s.energy<70) w += 8;
  if(s.bond<50 && b.likes==="bond_low") w += 12;

  if(b.rarity==="稀有"){
    if(s.bond>=50) w += 4;
    if(s.bond>=70) w += 5;
    if(s.bond>=85) w += 7;
  }

  if(b.id==="abyssray") w *= 0.55;
  if(b.id==="tempestgryph") w *= 0.60;
  if(b.id==="mountainstag") w *= 0.65;

  return Math.max(1,w);
}

function fallbackCandidates(pool,s,a){
  const p = careProfile(s,a);

  if(p.lowBond){
    const low = pool.filter(b=>["bond_low","rest","energy","rest_high"].includes(b.likes));
    if(low.length) return low.slice(0,2);
  }

  const routeMap = {
    feed:["feed","feed_high"],
    play:["play","play_high","mood_high"],
    rest:["rest","rest_high","energy","energy_high"]
  };

  const routed = pool.filter(b=>routeMap[p.maxAct].includes(b.likes));
  if(routed.length) return routed.slice(0,2);

  return pool.slice(0,1);
}

function hatch(){
  if(state.stage !== "care") return;
  if(hatchTimer){ clearTimeout(hatchTimer); hatchTimer = null; }

  const egg = EGGS.find(e=>e.id===state.egg);
  const a = state.actions;
  const s = state.stats;

  const otherHighCount = [s.hunger,s.mood,s.energy].filter(v=>v>80).length;
  const prismEligible = s.bond>80 && otherHighCount>=2;

  let beast = null;

  if(prismEligible && Math.random()<PRISM_CHANCE){
    const prismPool = PRISM_IDS
      .map(id=>BEASTS.find(b=>b.id===id))
      .filter(b=>b && b.type===egg.special);

    const prismWeights = prismPool.map(b=>{
      let w = 10;
      const p = careProfile(s,a);
      if(b.likes==="balanced" && p.balanced) w += 12;
      if(b.likes==="bond_high" && s.bond>=90) w += 12;
      if(b.likes==="energy_high" && s.energy>=90) w += 12;
      if(b.likes==="mood_high" && s.mood>=90) w += 12;
      return {b,w};
    });

    beast = pickWeighted(prismWeights);
  }

  if(!beast){
    const pool = (EGG_POOLS[state.egg]||[])
      .map(id=>BEASTS.find(b=>b.id===id))
      .filter(Boolean);

    let candidates = pool.filter(b=>isEligible(b,s,a));

    if(!candidates.length){
      candidates = fallbackCandidates(pool,s,a);
    }

    beast = pickWeighted(
      candidates.map(b=>({b,w:qualificationWeight(b,s,a)}))
    );
  }

  state.last=beast.id;
  state.stage="hatch";

  if(!state.dex.includes(beast.id)) state.dex.push(beast.id);
  state.dexCounts[beast.id]=(state.dexCounts[beast.id]||0)+1;

  save();
  render();
}

    hatchTimer = null;
  }
  isHatching = false;

  document.querySelectorAll(".action").forEach(btn => {
    btn.disabled = false;
    btn.style.opacity = "";
    btn.style.cursor = "";
  });

  state.stage="start"; state.egg=null; state.stats=randomStartStats(); state.actions={feed:0,play:0,rest:0}; state.last=null; save(); render();
}
function render(){
  renderCoins();
  renderEggs();

  if(state.stage==="care"){
    if(dexNewBtnEl) dexNewBtnEl.style.display="";
    show("screen-care");
    renderCare();
  } else if(state.stage==="hatch"){
    if(dexNewBtnEl) dexNewBtnEl.style.display="";
    show("screen-hatch");
    renderHatch();
  } else if(state.stage==="dex"){
    if(dexNewBtnEl) dexNewBtnEl.style.display="";
    show("screen-dex");
    renderDex();
  } else {
    state.stage="start";
    show("screen-start");

    const dex=document.getElementById("screen-dex");
    if(dex){
      dex.classList.remove("hidden");
      dex.removeAttribute("aria-hidden");
      if(dexNewBtnEl) dexNewBtnEl.style.display="none";
      renderDex();
    }
  }
}
document.querySelectorAll(".action").forEach(b=>b.addEventListener("click",()=>act(b.dataset.act)));
if(abandonBtnEl) abandonBtnEl.addEventListener("click",resetRun);
if(toDexBtnEl) toDexBtnEl.addEventListener("click",()=>{state.stage="dex";save();render();});
if(newRunBtnEl) newRunBtnEl.addEventListener("click",resetRun);
if(dexNewBtnEl) dexNewBtnEl.addEventListener("click",resetRun);
if(dexTabsEl) dexTabsEl.addEventListener("click",(e)=>{
  const btn=e.target.closest("[data-dex-filter]");
  if(!btn) return;
  dexFilter=btn.dataset.dexFilter || "all";
  renderDex();
});

if(bootStartBtnEl) bootStartBtnEl.addEventListener("click",resumeGameFromSave);
if(bootResetBtnEl) bootResetBtnEl.addEventListener("click",clearAllProgress);
if(musicToggleBtnEl) musicToggleBtnEl.addEventListener("click",async ()=>{
  await unlockAudio();
  musicEnabled=!musicEnabled;
  updateMusicLabel();
  if(musicEnabled) startMusic(); else stopMusic();
});

/* 所有按鈕：手機與桌機皆可用的按壓動畫。 */
function pressOn(btn){
  if(!btn || btn.disabled) return;
  btn.classList.add("press-feedback");
}
function pressOff(btn){
  if(!btn) return;
  setTimeout(()=>btn.classList.remove("press-feedback"),70);
}

document.addEventListener("touchstart",(e)=>{
  const btn=e.target.closest && e.target.closest("button");
  pressOn(btn);
},{passive:true});

document.addEventListener("touchend",(e)=>{
  const btn=e.target.closest && e.target.closest("button");
  pressOff(btn);
},{passive:true});

document.addEventListener("touchcancel",(e)=>{
  const btn=e.target.closest && e.target.closest("button");
  pressOff(btn);
},{passive:true});

document.addEventListener("mousedown",(e)=>{
  const btn=e.target.closest && e.target.closest("button");
  pressOn(btn);
});

document.addEventListener("mouseup",(e)=>{
  const btn=e.target.closest && e.target.closest("button");
  pressOff(btn);
});

/* 實際操作仍以標準 click 為主，iPhone Safari 最穩定。 */
document.addEventListener("click",(e)=>{
  const btn=e.target.closest && e.target.closest("button");
  if(!btn || btn.disabled) return;
  // 開頭按鈕已有專屬音效，避免同一次點擊重播兩次。
  if(btn!==bootStartBtnEl && btn!==bootResetBtnEl){
    playClickSound();
  }
});

updateMusicLabel();
render();
</script>
</body>
</html>
